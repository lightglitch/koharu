[package]
name = "koharu-desktop"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
publish.workspace = true

[dependencies]
alphanumeric-sort = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
arboard = { workspace = true }
cef = { workspace = true }
dirs = { workspace = true }
fs-err = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
hayro = { workspace = true }
heck = { workspace = true }
# Fork addition: AVIF pages decode through dav1d, a system library; see FORK.md.
# Enabled here, not in the workspace, so the other crates build without it.
image = { workspace = true, features = ["avif-native"] }
indoc = { workspace = true }
koharu-agent = { workspace = true }
koharu-canvas = { workspace = true }
koharu-config = { workspace = true }
koharu-llm = { workspace = true }
koharu-pipeline = { workspace = true }
koharu-psd = { workspace = true }
koharu-renderer = { workspace = true }
koharu-runtime = { workspace = true }
koharu-scene = { workspace = true }
koharu-sentry = { workspace = true }
kurbo = { workspace = true }
parking_lot = { workspace = true }
rars = { workspace = true }
rayon = { workspace = true }
rfd = { workspace = true }
sanitize-filename = { workspace = true }
sentry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
specta-util = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-runtime-cef = { workspace = true }
tauri-winit = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ui-events = { workspace = true }
webp = { workspace = true }
wgpu = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Fork addition: the Windows wheel's tools (`src/wheel.rs`).
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "UI_Input",
    "Win32_UI_Input_Radial",
] }

[target.'cfg(target_os = "linux")'.dependencies]
winit-common = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
